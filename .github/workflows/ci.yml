name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CPU Benchmark (cryptographic hashing)
        run: |
          echo "Starting CPU benchmark with SHA-512 hashing..."
          echo "This workload should take ~90-120s depending on CPU performance"
          time for i in $(seq 1 50000); do
            echo "benchmark data iteration $i" | openssl dgst -sha512 > /dev/null
          done
          echo "Benchmark completed!"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: gha-3rd-party-runner-sample-web:latest

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CPU Benchmark (cryptographic hashing)
        run: |
          echo "Starting CPU benchmark with SHA-512 hashing..."
          echo "This workload should take ~90-120s depending on CPU performance"
          time for i in $(seq 1 50000); do
            echo "benchmark data iteration $i" | openssl dgst -sha512 > /dev/null
          done
          echo "Benchmark completed!"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with cache
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: false
          load: true
          tags: gha-3rd-party-runner-sample-web:latest

      - name: Create and Setup DB
        # MySQLコンテナが応答できるまで10秒スリープする
        run: |
          docker compose up -d database
          sleep 10
          docker compose run -e RAILS_ENV=test web rails db:create
          docker compose run -e RAILS_ENV=test web rails db:migrate

      - name: Run RSpec
        run: docker compose run -e RAILS_ENV=test web bundle exec rspec

      - name: Run RuboCop
        run: docker compose run web bundle exec rubocop

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/src/tmp/screenshots
          if-no-files-found: ignore
